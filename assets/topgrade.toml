[misc]
assume_yes = true
pre_sudo = true
sudo_command = "sudo"

# Steps topgrade must not run:
#   "system"      = macOS softwareupdate — `make updates` (bin/macos-updates)
#                   handles it, and never installs a major macOS upgrade
#   "pnpm", "node" = not used on this Mac
#   "claude_code_plugins" = runs `claude plugin marketplace update`, which
#                   grabs the tty and gets SIGTTOU'd, suspending the whole run
#   "claude_code" = Claude Code updates itself; no need to run it here
disable = ["system", "pnpm", "node", "claude_code", "claude_code_plugins"]
ignore_failures = ["pnpm"]

no_retry = true
cleanup = true

# Homebrew manages the topgrade binary
no_self_update = true

# One notification at the end, not one per step
notify_each_step = false

# No [pre_commands] greedy cask upgrade: `greedy_cask` below already upgrades
# every cask, and a pre-command ran the same upgrade a second time — before
# `brew update`, so against stale formula metadata.

[brew]
greedy_cask = true
autoremove = true
# fetch_head = true # Only enable if you use HEAD builds of formulae!
